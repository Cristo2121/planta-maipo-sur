<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .level-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #0369a1; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #0284c7; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: bold; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
  <rect x="15" y="15" width="820" height="530" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- Title -->
  <text x="35" y="48" class="title">ARQUITECTURA DE SEGURIDAD · PLANTA MAIPO SUR</text>
  <text x="35" y="68" class="subtitle">Modelo de Zonas y Conductos Purdue (IEC 62443 / NIST SP 800-82 Rev. 3)</text>
  <rect x="670" y="32" width="145" height="26" fill="#dcfce7" stroke="#86efac" rx="4"/>
  <text x="682" y="49" class="badge">POBLACIÓN: 80.000 HAB.</text>

  <!-- Level 4 / 3.5: Nube & DMZ -->
  <rect x="40" y="95" width="770" height="85" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" rx="6"/>
  <text x="55" y="118" class="level-tag">NIVEL 4 / 3.5 · FRONTERA &amp; DMZ INDUSTRIAL</text>
  
  <rect x="70" y="128" width="310" height="42" fill="#ffffff" stroke="#7dd3fc" rx="4"/>
  <text x="85" y="146" class="box-title">Servicio Web de Telemetría</text>
  <text x="85" y="161" class="box-desc">Publica lecturas en la nube (Puerto 443 / HTTPS)</text>

  <rect x="450" y="128" width="330" height="42" fill="#ffffff" stroke="#7dd3fc" rx="4"/>
  <text x="465" y="146" class="box-title">Asistente de IA (Consultas de Turno)</text>
  <text x="465" y="161" class="box-desc">Solo lectura · Sin permisos para enviar órdenes al PLC</text>

  <!-- Downward Arrow 1 -->
  <line x1="225" y1="180" x2="225" y2="208" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="198" class="arrow-text">Cortafuegos Industrial / VPN Segura</text>

  <!-- Level 2: Supervisión HMI/SCADA -->
  <rect x="40" y="215" width="770" height="85" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="55" y="238" class="level-tag">NIVEL 2 · SUPERVISIÓN DE ÁREA (SCADA / HMI)</text>

  <rect x="70" y="248" width="480" height="42" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="85" y="266" class="box-title">Panel del Operador de Planta (HMI)</text>
  <text x="85" y="281" class="box-desc">Monitoreo continuo de cloro (mg/L) · Poder de veto humano sobre cambios</text>

  <rect x="580" y="248" width="200" height="42" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
  <text x="595" y="266" class="box-title" fill="#991b1b">Poder de Veto</text>
  <text x="595" y="281" class="box-desc" fill="#b91c1c">Prioridad: Seguridad física</text>

  <!-- Downward Arrow 2 -->
  <line x1="225" y1="300" x2="225" y2="328" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="318" class="arrow-text">Conducto Aislado: Modbus TCP (Puerto 502)</text>

  <!-- Level 1: Control Básico (PLC) -->
  <rect x="40" y="335" width="770" height="85" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="6"/>
  <text x="55" y="358" class="level-tag">NIVEL 1 · CONTROL BÁSICO INDUSTRIAL</text>

  <rect x="70" y="368" width="710" height="42" fill="#ffffff" stroke="#60a5fa" rx="4"/>
  <text x="85" y="386" class="box-title">PLC Dosificador de Cloro (Controlador Lógico)</text>
  <text x="85" y="401" class="box-desc">Credencial aislada en variable de entorno (PLC_PASSWORD) · Sin exposición a Internet</text>

  <!-- Downward Arrow 3 -->
  <line x1="225" y1="420" x2="225" y2="448" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="438" class="arrow-text">Señal Eléctrica 4-20mA / Relé Físico</text>

  <!-- Level 0: Proceso Físico -->
  <rect x="40" y="455" width="770" height="80" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" rx="6"/>
  <text x="55" y="476" class="level-tag" fill="#047857">NIVEL 0 · PROCESO FÍSICO (AGUA POTABLE)</text>

  <rect x="70" y="484" width="340" height="40" fill="#ffffff" stroke="#6ee7b7" rx="4"/>
  <text x="85" y="501" class="box-title">Bomba Dosificadora de Cloro</text>
  <text x="85" y="516" class="box-desc">Consigna controlada: 0.2 - 2.0 mg/L</text>

  <rect x="440" y="484" width="340" height="40" fill="#ffffff" stroke="#6ee7b7" rx="4"/>
  <text x="455" y="501" class="box-title">Red de Distribución Comunal</text>
  <text x="455" y="516" class="box-desc">Abastecimiento seguro a 80.000 habitantes</text>
</svg>
